name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 연속 push 시 이전 실행 취소 (해커톤 중 큐 밀림 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # 빌드 시점에 실제 키가 필요하면 안 된다.
          # Gemini 클라이언트는 요청 시점에만 초기화되므로 여기서는 더미로 충분.
          GEMINI_API_KEY: dummy-key-for-build
